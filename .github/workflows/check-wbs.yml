name: Check WBS

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.csv"
      - "**/*.tsv"
      - "**/*.xlsx"
      - "**/*.xls"
      - "**/*.xlsm"
      - "**/*.ods"
      - "**/*.txt"
      - "**/*.text"
      - "**/*.md"
      - "**/*.markdown"
      - "**/*.docx"
      - "**/*.rtf"
      - "**/*.doc"
      - "**/*.pdf"
      - "SKILL.md"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/check-wbs.yml"
  workflow_dispatch:

concurrency:
  group: check-wbs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.marker.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Kiểm tra commit có [check]
        id: marker
        run: |
          message="$(git log -1 --format=%B)"
          if printf '%s\n' "$message" | grep -Eq '\[check\][^[:space:]]+'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Commit mới nhất không chứa [check]<nội dung>, ví dụ [check]xxxxxxxx. Bỏ qua test và review." >> "$GITHUB_STEP_SUMMARY"
          fi

  test:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Phân loại file
        run: python -m unittest discover -s tests -v

  review:
    needs: [gate, test]
    if: needs.gate.outputs.run == 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kiểm tra secret
        id: key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ] && { [ -n "$GEMINI_API_KEY" ] || [ -n "$DEEPSEEK_API_KEY" ]; }; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Thiếu DISCORD_WEBHOOK_URL hoặc thiếu cả GEMINI_API_KEY và DEEPSEEK_API_KEY. Không chạy review." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Review WBS
        if: steps.key.outputs.present == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/check_wbs.py
